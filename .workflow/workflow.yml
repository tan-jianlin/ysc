name: ysc-auto-update
displayName: 影视仓接口自动更新
triggers:
  schedule:
    - cron: "0 4 * * *"
steps:
  - step: setup-python
    setup:
      python-version: "3.9"
  - step: run-update
    script: |
      python update_sources.py
  - step: git-push
    script: |
      git config user.name "tan-jianlin"
      git config user.email "auto@ysc.local"
      git add -A
      git diff --staged --quiet || git commit -m "auto update $(date +%Y-%m-%d)"
      git push https://tan-jianlin:${{ secrets.GITEE_TOKEN }}@gitee.com/tan-jianlin/ysc.git HEAD:master
