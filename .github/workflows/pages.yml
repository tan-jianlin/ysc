name: deploy-pages
on:
  push:
    branches: [lottery]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
  administration: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lottery

      - name: Enable Pages (build_type workflow) + capture response
        id: enable
        run: |
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: pages-enabler" \
            https://api.github.com/repos/tan-jianlin/ysc/pages \
            -d '{"build_type":"workflow"}')
          echo "enable_http=$CODE" | tee debug_pages.txt
          cat /tmp/resp.json | tee -a debug_pages.txt
          # also probe GET /pages for current state
          CODE2=$(curl -s -o /tmp/resp2.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: pages-enabler" \
            https://api.github.com/repos/tan-jianlin/ysc/pages)
          echo "get_http=$CODE2" >> debug_pages.txt
          cat /tmp/resp2.json >> debug_pages.txt
          echo "token_scopes_check:" >> debug_pages.txt
          curl -sI -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/user | grep -iE "x-oauth-scopes|x-accepted|HTTP/" >> debug_pages.txt || true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit debug info (self push, does not retrigger)
        if: failure()
        run: |
          git config user.name "pages-bot"
          git config user.email "pages-bot@users.noreply.github.com"
          git add debug_pages.txt || true
          git commit -m "debug: pages enablement response" || true
          git push origin lottery || true
